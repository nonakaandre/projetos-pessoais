<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Light/Dark</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            transition: background 0.3s, color 0.3s;
        }
        .hero {
            padding: 80px 0;
        }
        .theme-btn {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-body text-body">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-body-secondary border-bottom">
        <div class="container">
            <a class="navbar-brand" href="#">Tema Claro/Escuro</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3 theme-btn" id="toggleTheme">🌙 Alternar tema</li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="hero text-center bg-body-secondary">
        <div class="container">
            <h1 class="display-5 fw-bold">Troca de Tema Instantânea</h1>
            <p class="lead">Bootstrap 5.3 já vem com suporte nativo para temas.</p>
        </div>
    </section>

    <!-- CARDS -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-sm-6 col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Componente 1</h5>
                            <p class="card-text">Texto adaptável ao tema.</p>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Componente 2</h5>
                            <p class="card-text">Totalmente responsivo.</p>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-lg-4">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title">Componente 3</h5>
                            <p class="card-text">Integração simples e rápida.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="text-center py-3 bg-body-secondary border-top">
        <p class="m-0">Tema Claro/Escuro • 2025</p>
    </footer>

    <script>
        const html = document.documentElement;
        const btn = document.getElementById('toggleTheme');

        btn.addEventListener('click', () => {
            const temaAtual = html.getAttribute('data-bs-theme');
            const novoTema = temaAtual === 'light' ? 'dark' : 'light';
            html.setAttribute('data-bs-theme', novoTema);
            btn.textContent = novoTema === 'light' ? '🌙 Alternar tema' : '☀️ Alternar tema';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
